<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>جولة زيارة الشركات الناشئة — مسقط</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B2A4A; --navy-light:#2A3F66; --navy-deep:#111B32;
    --gold:#C9A24B; --gold-light:#E8D9B5; --cream:#F7F2E7;
    --white:#FFFFFF; --ink:#1B1F27; --muted:#6B7280;
    --line:#E4DFD1; --danger:#B23A48; --danger-bg:#F7E9EA;
    --radius:14px; --shadow:0 10px 30px rgba(17,27,50,.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--cream); color:var(--ink);
    font-family:'Cairo',-apple-system,'Segoe UI',Tahoma,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    background:linear-gradient(135deg,var(--navy-deep),var(--navy));
    color:var(--white); padding:18px 20px 16px; flex:0 0 auto;
    box-shadow:0 4px 18px rgba(17,27,50,.25); position:relative; z-index:20;
  }
  header h1{margin:0; font-size:1.28rem; font-weight:800; letter-spacing:.2px;}
  header p{margin:4px 0 0; font-size:.86rem; color:var(--gold-light); font-weight:500;}
  .summary-bar{
    display:flex; gap:18px; margin-top:12px; font-size:.78rem; color:#CFE0F0; flex-wrap:wrap;
  }
  .summary-bar b{color:var(--gold); font-weight:700;}

  nav.day-tabs{
    display:flex; gap:8px; padding:10px 14px; overflow-x:auto;
    background:var(--navy-light); flex:0 0 auto; -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
  }
  nav.day-tabs::-webkit-scrollbar{height:5px;}
  nav.day-tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25); border-radius:6px;}
  .tab{
    flex:0 0 auto; display:flex; align-items:center; gap:7px;
    background:rgba(255,255,255,.08); color:#E7ECF5; border:1px solid rgba(255,255,255,.14);
    border-radius:999px; padding:8px 14px; font-family:inherit; font-size:.82rem; font-weight:600;
    cursor:pointer; white-space:nowrap; transition:background .18s,border-color .18s,transform .12s;
  }
  .tab .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto; background:var(--gold);}
  .tab:hover{background:rgba(255,255,255,.16);}
  .tab:active{transform:scale(.97);}
  .tab.active{background:var(--gold); color:var(--navy-deep); border-color:var(--gold); font-weight:800;}
  .tab.active .dot{background:var(--navy-deep);}
  .tab:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  main{flex:1 1 auto; display:flex; flex-direction:column; min-height:0;}
  @media (min-width:900px){ main{flex-direction:row-reverse;} }

  aside.stop-list{
    flex:0 0 auto; background:var(--white); border-bottom:1px solid var(--line);
    overflow-y:auto; max-height:38vh;
  }
  @media (min-width:900px){
    aside.stop-list{
      flex:0 0 360px; max-height:none; border-bottom:none;
      border-inline-start:1px solid var(--line);
    }
  }
  .list-heading{
    padding:14px 16px 8px; font-size:.72rem; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:.03em; position:sticky; top:0; background:var(--white); z-index:2;
  }
  .day-group-label{
    padding:10px 16px 4px; font-size:.78rem; font-weight:800; color:var(--navy);
    display:flex; align-items:center; gap:8px;
  }
  .day-group-label .dot{width:8px; height:8px; border-radius:50%;}
  .stop-card{
    display:flex; gap:10px; align-items:flex-start; padding:10px 16px; cursor:pointer;
    border-inline-start:4px solid transparent; transition:background .15s, border-color .15s;
  }
  .stop-card:hover, .stop-card:focus-visible{background:var(--cream);}
  .stop-card.selected{background:var(--gold-light);}
  .badge{
    flex:0 0 30px; width:30px; height:30px; border-radius:50%; color:var(--white);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.82rem;
    margin-top:2px;
  }
  .stop-info{flex:1 1 auto; min-width:0;}
  .stop-info .name{font-weight:700; font-size:.92rem; color:var(--ink); display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .stop-info .meta{font-size:.78rem; color:var(--muted); margin-top:2px;}
  .stop-info .note{font-size:.78rem; color:#4B5566; margin-top:3px; line-height:1.4;}
  .est-flag{
    font-size:.66rem; font-weight:700; color:var(--danger); background:var(--danger-bg);
    padding:1px 7px; border-radius:999px; display:inline-block;
  }
  .go-link{
    flex:0 0 auto; align-self:center; color:var(--navy); opacity:.55; font-size:1.05rem;
    text-decoration:none; padding:4px;
  }
  .stop-card:hover .go-link{opacity:1;}

  #map{flex:1 1 auto; min-height:44vh;}
  @media (min-width:900px){ #map{min-height:0;} }

  .leaflet-popup-content-wrapper{
    border-radius:12px; font-family:'Cairo',sans-serif; box-shadow:var(--shadow);
  }
  .leaflet-popup-content{margin:14px 16px; direction:rtl; min-width:210px;}
  .popup-title{font-weight:800; font-size:1rem; color:var(--navy); margin-bottom:2px;}
  .popup-meta{font-size:.78rem; color:var(--muted); margin-bottom:6px;}
  .popup-note{font-size:.82rem; color:#3A4150; margin-bottom:10px; line-height:1.5;}
  .popup-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    background:var(--navy); color:var(--white); text-decoration:none; font-weight:700;
    font-size:.82rem; padding:9px 10px; border-radius:9px; transition:background .15s;
  }
  .popup-btn:hover{background:var(--navy-light);}

  .legend{
    position:absolute; z-index:15; background:rgba(255,255,255,.94); border-radius:12px;
    padding:10px 12px; box-shadow:var(--shadow); font-size:.72rem; bottom:14px; inset-inline-end:14px;
    display:none; max-width:170px;
  }
  .legend.show{display:block;}
  .legend-row{display:flex; align-items:center; gap:7px; margin:3px 0;}
  .legend-row .dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}

  @media (prefers-reduced-motion: reduce){
    .tab, .stop-card, .go-link, .popup-btn{transition:none;}
  }
</style>
</head>
<body>

<header>
  <h1>جولة زيارة الشركات الناشئة — مسقط</h1>
  <p>مرتّبة حسب القرب الجغرافي، بترتيب الزيارة اليومي</p>
  <div class="summary-bar">
    <span>عدد الشركات: <b>24</b></span>
    <span>عدد الأيام: <b>8</b></span>
    <span>الفترة: <b>الأحد إلى الأربعاء، أسبوعين متتاليين</b></span>
  </div>
</header>

<nav class="day-tabs" id="dayTabs"></nav>

<main>
  <aside class="stop-list" id="stopList"></aside>
  <div id="map"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DAYS = [

    {order:3, name:"RQMNA", lat:23.571527, lng:58.175286, note:"الخوض / واحة المعرفة / مرياد", time:"1:30 م", mapsUrl:"https://maps.google.com/?cid=11174446840681489627", estimated:false, orig:4}
  ]},

    {order:4, name:"SAFAQAT", lat:23.6564, lng:58.1834, note:"المعبيلة الجنوبية، جنب العريمي بوليفارد", time:"9:30 ص", mapsUrl:"https://www.google.com/maps/search/?api=1&query=23.6564,58.1834", estimated:true, orig:23},
    {order:5, name:"MASARRAH", lat:23.6316, lng:58.1984, note:"شارع الخوض التجاري، بناية سما الخوض", time:"11:30 ص", mapsUrl:"https://www.google.com/maps/search/?api=1&query=23.6316,58.1984", estimated:true, orig:24},
    {order:6, name:"SMART DEVELOPER", lat:23.615276, lng:58.202241, note:"الخوض٣، البناية ٥٤٠، ط١، م١٣", time:"1:30 م", mapsUrl:"https://maps.google.com/?cid=15424274463821089673", estimated:false, orig:21}
  ]},
  { id:3, dayName:"الثلاثاء", weekLabel:"الأسبوع الأول", date:"١٨ أغسطس ٢٠٢٦", color:"#2F7A5E", stops:[
    {order:7, name:"Data Mining", lat:23.614996, lng:58.203435, note:"الخوض / السيب", time:"9:30 ص", mapsUrl:"https://maps.google.com/?cid=17784079852589152517", estimated:false, orig:14},
    {order:8, name:"ANKAA", lat:23.613839, lng:58.212845, note:"الخوض، مبنى مزون سكوير", time:"11:30 ص", mapsUrl:"https://maps.google.com/?cid=2824878142707473833", estimated:false, orig:18},
    {order:9, name:"GISHUB", lat:23.596071, lng:58.215016, note:"الموالح الجنوبية، مبنى المرام", time:"1:30 م", mapsUrl:"https://maps.google.com/?cid=18422962599291018965", estimated:false, orig:15}
  ]},
  { id:4, dayName:"الأربعاء", weekLabel:"الأسبوع الأول", date:"١٩ أغسطس ٢٠٢٦", color:"#A6425A", stops:[
    {order:10, name:"FASCANO", lat:23.600498, lng:58.242897, note:"الموالح الجنوبية", time:"9:30 ص", mapsUrl:"https://maps.google.com/?cid=8271141515665725050", estimated:false, orig:8},
    {order:11, name:"DARRBAK", lat:23.619117, lng:58.256495, note:"شارع الموج", time:"11:30 ص", mapsUrl:"https://maps.google.com/?cid=8293619453944969068", estimated:false, orig:22},
    {order:12, name:"AMAN", lat:23.620076, lng:58.258826, note:"الموالح الشمالية، شارع الموج", time:"1:30 م", mapsUrl:"https://maps.google.com/?cid=7554629312913737439", estimated:false, orig:16}
  ]},
  { id:5, dayName:"الأحد", weekLabel:"الأسبوع الثاني", date:"٢٣ أغسطس ٢٠٢٦", color:"#2E6F95", stops:[
    {order:13, name:"DECOIL", lat:23.576158, lng:58.296779, note:"مرتفعات المطار / السيب", time:"9:30 ص", mapsUrl:"https://maps.google.com/?cid=4648634808745154312", estimated:false, orig:17},
    {order:14, name:"BYANAT", lat:23.578214, lng:58.298815, note:"مرتفعات المطار / السيب", time:"11:30 ص", mapsUrl:"https://maps.google.com/?cid=2031184514833825103", estimated:false, orig:13},
    {order:15, name:"iON LLC", lat:23.581093, lng:58.335241, note:"غلا الصناعية / بوشر", time:"1:30 م", mapsUrl:"https://maps.google.com/?cid=15723197772148076528", estimated:false, orig:5}
  ]},
  { id:6, dayName:"الاثنين", weekLabel:"الأسبوع الثاني", date:"٢٤ أغسطس ٢٠٢٦", color:"#7A5C9E", stops:[
    {order:16, name:"INNOTECH", lat:23.571909, lng:58.339622, note:"غلا الصناعية", time:"9:30 ص", mapsUrl:"https://maps.google.com/?cid=16664926526295978548", estimated:false, orig:19},
    {order:17, name:"SOOQ CARS", lat:23.572288, lng:58.35743, note:"غلا الصناعية / بوشر", time:"11:30 ص", mapsUrl:"https://www.google.com/maps/search/?api=1&query=23.572288,58.35743", estimated:true, orig:1},
    {order:18, name:"MUSALIH", lat:23.573288, lng:58.35843, note:"غلا الصناعية، بجانب إلنجي", time:"1:30 م", mapsUrl:"https://www.google.com/maps/search/?api=1&query=23.573288,58.35843", estimated:true, orig:7}
  ]},
  { id:7, dayName:"الثلاثاء", weekLabel:"الأسبوع الثاني", date:"٢٥ أغسطس ٢٠٢٦", color:"#C1652E", stops:[
    {order:19, name:"RIHAL (Data Migration and Services)", lat:23.58342, lng:58.367587, note:"غلا الصناعية / بوشر", time:"9:30 ص", mapsUrl:"https://maps.google.com/?cid=10100508700981090066", estimated:false, orig:3},
    {order:20, name:"GODOBA", lat:23.60017, lng:58.38014, note:"العذيبة", time:"11:30 ص", mapsUrl:"https://maps.google.com/?cid=16360268902690163015", estimated:false, orig:11},
    {order:21, name:"ESBAAR", lat:23.596689, lng:58.428339, note:"الخوير", time:"1:30 م", mapsUrl:"https://maps.google.com/?cid=151324147504774591", estimated:false, orig:6}
  ]},
  { id:8, dayName:"الأربعاء", weekLabel:"الأسبوع الثاني", date:"٢٦ أغسطس ٢٠٢٦", color:"#4A4A68", stops:[
    {order:22, name:"GLOBCOM", lat:23.589384, lng:58.430506, note:"الخوير الجنوبية / بوشر", time:"9:30 ص", mapsUrl:"https://maps.google.com/?cid=18144253601025453855", estimated:false, orig:9},
    {order:23, name:"TATWEER", lat:23.6081, lng:58.4447, note:"حي الصاروج، مقابل الغراند حياة مسقط (سابقاً حياة ريجنسي)", time:"11:30 ص", mapsUrl:"https://www.google.com/maps/search/?api=1&query=23.6081,58.4447", estimated:true, orig:12},
    {order:24, name:"IBN FIRNAS", lat:23.596824, lng:58.448334, note:"الخوير", time:"1:30 م", mapsUrl:"https://maps.google.com/?cid=18242655285177216581", estimated:false, orig:10}
  ]}
];

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let currentDayId = 'all';
let markerLayer, routeLayer;

const map = L.map('map', { zoomControl:true, attributionControl:true }).setView([23.60, 58.28], 11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
  subdomains:'abcd', maxZoom:20
}).addTo(map);

const legend = L.control({position:'bottomright'});
legend.onAdd = function(){
  const div = L.DomUtil.create('div','legend');
  div.id = 'legendBox';
  return div;
};
legend.addTo(map);

function makeIcon(color, label){
  return L.divIcon({
    className:'',
    html:`<div style="background:${color};width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Cairo,sans-serif;font-weight:800;font-size:12px;border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3);">${label}</div>`,
    iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-15]
  });
}

function popupHtml(stop, day){
  const flag = stop.estimated ? `<span class="est-flag">تقديري</span>` : '';
  return `
    <div class="popup-title">${stop.order}. ${stop.name} ${flag}</div>
    <div class="popup-meta">${day.dayName} ${day.date} · ${stop.time} · رقمها الأصلي بجدولك: ${stop.orig}</div>
    <div class="popup-note">${stop.note}</div>
    <a class="popup-btn" href="${stop.mapsUrl}" target="_blank" rel="noopener">افتح في خرائط جوجل ↗</a>
  `;
}

function render(dayId){
  currentDayId = dayId;

  document.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.id === String(dayId));
  });

  if (markerLayer) map.removeLayer(markerLayer);
  if (routeLayer) map.removeLayer(routeLayer);
  markerLayer = L.layerGroup().addTo(map);
  routeLayer = L.layerGroup().addTo(map);

  const daysToShow = dayId === 'all' ? DAYS : DAYS.filter(d => d.id === dayId);
  const bounds = [];
  const markerRefs = {};

  daysToShow.forEach(day=>{
    const latlngs = [];
    day.stops.forEach(stop=>{
      const marker = L.marker([stop.lat, stop.lng], { icon: makeIcon(day.color, stop.order) });
      marker.bindPopup(popupHtml(stop, day));
      marker.addTo(markerLayer);
      markerRefs[stop.order] = marker;
      latlngs.push([stop.lat, stop.lng]);
      bounds.push([stop.lat, stop.lng]);
    });
    L.polyline(latlngs, { color: day.color, weight: dayId==='all'?2:3, opacity: dayId==='all'?0.55:0.85, dashArray:'6 7' }).addTo(routeLayer);
  });

  window._markerRefs = markerRefs;

  if (bounds.length){
    map.flyToBounds(bounds, { padding:[46,46], maxZoom: dayId==='all'?12:15, animate:!reduceMotion, duration: reduceMotion?0:0.6 });
  }

  const legendBox = document.getElementById('legendBox');
  if (dayId === 'all'){
    legendBox.classList.add('show');
    legendBox.innerHTML = DAYS.map(d=>`<div class="legend-row"><span class="dot" style="background:${d.color}"></span>${d.dayName} (${d.weekLabel==='الأسبوع الأول'?'١':'٢'})</div>`).join('');
  } else {
    legendBox.classList.remove('show');
  }

  renderList(dayId, markerRefs);
}

function renderList(dayId, markerRefs){
  const list = document.getElementById('stopList');
  const daysToShow = dayId === 'all' ? DAYS : DAYS.filter(d => d.id === dayId);
  const heading = dayId === 'all'
    ? `كل الشركات (٢٤) — مرتّبة حسب اليوم`
    : `${daysToShow[0].dayName} — ${daysToShow[0].date} (${daysToShow[0].weekLabel})`;

  let html = `<div class="list-heading">${heading}</div>`;
  daysToShow.forEach(day=>{
    if (dayId === 'all'){
      html += `<div class="day-group-label"><span class="dot" style="background:${day.color}"></span>${day.dayName} — ${day.date}</div>`;
    }
    day.stops.forEach(stop=>{
      const flag = stop.estimated ? `<span class="est-flag">تقديري</span>` : '';
      html += `
        <div class="stop-card" data-order="${stop.order}" tabindex="0" style="border-inline-start-color:${day.color}">
          <div class="badge" style="background:${day.color}">${stop.order}</div>
          <div class="stop-info">
            <div class="name">${stop.name} ${flag}</div>
            <div class="meta">${stop.time} · ${dayId==='all' ? day.dayName+' '+day.date : 'رقمها الأصلي: '+stop.orig}</div>
            <div class="note">${stop.note}</div>
          </div>
          <a class="go-link" href="${stop.mapsUrl}" target="_blank" rel="noopener" title="افتح في خرائط جوجل" onclick="event.stopPropagation()">↗</a>
        </div>`;
    });
  });
  list.innerHTML = html;

  list.querySelectorAll('.stop-card').forEach(card=>{
    const openIt = ()=>{
      const order = card.dataset.order;
      const marker = markerRefs[order];
      if (marker){
        map.flyTo(marker.getLatLng(), 16, { animate:!reduceMotion, duration: reduceMotion?0:0.6 });
        setTimeout(()=>marker.openPopup(), reduceMotion?0:400);
      }
      list.querySelectorAll('.stop-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
    };
    card.addEventListener('click', openIt);
    card.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openIt(); }});
  });
}

function buildTabs(){
  const nav = document.getElementById('dayTabs');
  let html = `<button class="tab active" data-id="all"><span class="dot" style="background:#C9A24B"></span>الكل (٢٤)</button>`;
  DAYS.forEach(d=>{
    const weekNo = d.weekLabel === 'الأسبوع الأول' ? '١' : '٢';
    html += `<button class="tab" data-id="${d.id}"><span class="dot" style="background:${d.color}"></span>${d.dayName} ${weekNo}</button>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const id = tab.dataset.id === 'all' ? 'all' : Number(tab.dataset.id);
      render(id);
    });
  });
}

buildTabs();
render('all');
</script>
</body>
</html>
